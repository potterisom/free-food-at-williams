name: Refresh and publish public listings
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "16 13 * * *"

concurrency:
  group: public-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - if: github.event_name != 'schedule'
        run: npm test
      - name: Pull reviewed campus listings
        env:
          WILLIAMS_FEED_ACCESS: ${{ secrets.WILLIAMS_FEED_ACCESS }}
        run: node scripts/pull-reviewed.mjs
      - name: Build calendar
        id: build
        env:
          WILLIAMS_INBOX_ONLY: ${{ github.event.schedule == '7,22,37,52 * * * *' }}
        run: npm run build
      - if: steps.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
